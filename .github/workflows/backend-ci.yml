name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: YourStrong@Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./src/backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: ./src/backend

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
        working-directory: ./src/backend
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=BudgetBuddyDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/backend/**/TestResults/*.trx

      - name: Publish
        run: dotnet publish --no-build --configuration Release --output ./publish
        working-directory: ./src/backend/BudgetBuddy.API

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: src/backend/BudgetBuddy.API/publish
