name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/BudgetBuddy.Api/BudgetBuddy.Api.csproj

    - name: Build
      run: dotnet build backend/BudgetBuddy.Api/BudgetBuddy.Api.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test backend/BudgetBuddy.Api/BudgetBuddy.Api.csproj --no-build --configuration Release --verbosity normal

    - name: Publish
      run: dotnet publish backend/BudgetBuddy.Api/BudgetBuddy.Api.csproj --no-build --configuration Release --output ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-app
        path: ./publish
