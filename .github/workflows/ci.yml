name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore src/backend/BudgetBuddy.sln
      
      - name: Build
        run: dotnet build src/backend/BudgetBuddy.sln --configuration Release --no-restore
      
      - name: Test
        run: dotnet test src/backend/BudgetBuddy.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/test-results.trx'
      
      - name: Publish API
        run: dotnet publish src/backend/BudgetBuddy.Api/BudgetBuddy.Api.csproj --configuration Release --output ./api-publish
      
      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: ./api-publish

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd src/frontend
          npm ci
      
      - name: Lint
        run: |
          cd src/frontend
          npm run lint
      
      - name: Build
        run: |
          cd src/frontend
          npm run build
        env:
          VITE_API_BASE_URL: https://api.budgetbuddy.example.com
      
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: src/frontend/dist

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/BudgetBuddy.Api/Dockerfile
          tags: budgetbuddy-api:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          tags: budgetbuddy-frontend:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
