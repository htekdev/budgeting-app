name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.6.0'

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform Init
      working-directory: infrastructure/terraform
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
          -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE }}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=budgetbuddy-${{ github.event.inputs.environment }}.tfstate"

    - name: Terraform Plan
      working-directory: infrastructure/terraform
      run: |
        terraform plan \
          -var="environment=${{ github.event.inputs.environment }}" \
          -var="sql_admin_password=${{ secrets.SQL_ADMIN_PASSWORD }}" \
          -out=tfplan

    - name: Terraform Apply
      working-directory: infrastructure/terraform
      run: terraform apply -auto-approve tfplan

    - name: Get Terraform Outputs
      id: tf-outputs
      working-directory: infrastructure/terraform
      run: |
        echo "backend_url=$(terraform output -raw backend_url)" >> $GITHUB_OUTPUT
        echo "frontend_url=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT

    outputs:
      backend_url: ${{ steps.tf-outputs.outputs.backend_url }}
      frontend_url: ${{ steps.tf-outputs.outputs.frontend_url }}

  deploy-backend:
    name: Deploy Backend
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: |
        cd backend/BudgetBuddy.Api
        dotnet publish -c Release -o ./publish

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: app-budgetbuddy-backend-${{ github.event.inputs.environment }}
        package: backend/BudgetBuddy.Api/publish

  deploy-frontend:
    name: Deploy Frontend
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build
      working-directory: frontend
      env:
        VITE_API_URL: ${{ needs.deploy-infrastructure.outputs.backend_url }}/api
      run: |
        npm ci
        npm run build

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: app-budgetbuddy-frontend-${{ github.event.inputs.environment }}
        package: frontend/dist

  run-migrations:
    name: Run Database Migrations
    needs: [deploy-infrastructure, deploy-backend]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install EF Core Tools
      run: dotnet tool install --global dotnet-ef

    - name: Run Migrations
      working-directory: backend/BudgetBuddy.Api
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}
      run: |
        dotnet ef database update

  verify-deployment:
    name: Verify Deployment
    needs: [deploy-backend, deploy-frontend, run-migrations]
    runs-on: ubuntu-latest
    
    steps:
    - name: Check Backend Health
      run: |
        curl -f ${{ needs.deploy-infrastructure.outputs.backend_url }}/health || exit 1

    - name: Check Frontend
      run: |
        curl -f ${{ needs.deploy-infrastructure.outputs.frontend_url }} || exit 1

    - name: Deployment Summary
      run: |
        echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "**Backend URL:** ${{ needs.deploy-infrastructure.outputs.backend_url }}" >> $GITHUB_STEP_SUMMARY
        echo "**Frontend URL:** ${{ needs.deploy-infrastructure.outputs.frontend_url }}" >> $GITHUB_STEP_SUMMARY
