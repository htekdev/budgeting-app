name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./src/frontend

      - name: Lint
        run: npm run lint
        working-directory: ./src/frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: ./src/frontend

      - name: Build
        run: npm run build
        working-directory: ./src/frontend
        env:
          VITE_API_URL: http://localhost:5000

      - name: Run tests
        run: npm test -- --run
        working-directory: ./src/frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/frontend/dist
