version: '3.8'

services:
  backend:
    environment:
      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Debug
      - ASPNETCORE_LOGGING__LOGLEVEL__MICROSOFT.ASPNETCORE=Information
    volumes:
      - ./src/backend:/app/src:ro
      - backend_obj:/app/obj
      - backend_bin:/app/bin

  frontend:
    volumes:
      - ./src/frontend/src:/app/src:ro
      - ./src/frontend/public:/app/public:ro
      - frontend_node_modules:/app/node_modules

volumes:
  backend_obj:
  backend_bin:
  frontend_node_modules:
